name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Dependency integrity
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q forgesight_ad tools tests demo_app.py
      - name: Run synthetic regression tests
        run: python -m pytest --basetemp "$RUNNER_TEMP/forgesight-pytest" -q

# CI deliberately does not download datasets, detector artifacts, or Docker
# wheelhouses; it does not require CUDA or run GPU/browser integration tests.
